  - id: "fintech-main-env-exposure"
    host: "paleon-lab-fintech.co.uk"
    path: "/.env"
    type: "sensitive-file-exposure"
    title: "Environment file exposed at /.env"
    description: "The main site serves an .env file at the web root. All values are fake placeholders (see .env content). No real secrets are present."
    severity: "observed"
    status: "must_be_reported"
    evidence:
      - "HTTP 200 response at /.env"
      - "Content-Type: text/plain"
      - "Contains APP_ENV=development, DEMO_KEY=placeholder-demo-key"
      - "Contains fake AWS ARN: arn:aws:example:eu-west-2:123456789012:example-resource"
    notes: "Intentionally exposed for scanner testing. All values are synthetic."

  - id: "fintech-main-env-fake-aws-arn"
    host: "paleon-lab-fintech.co.uk"
    path: "/.env"
    type: "secret-shaped-reference"
    title: "Fake AWS ARN reference in exposed .env"
    description: "The exposed .env contains a string matching the AWS ARN pattern (arn:aws:example:...) that is intentionally fake (uses 'example' partition)."
    severity: "observed"
    status: "must_be_reported"
    must_not_flag_as: "real-aws-secret"
    evidence:
      - "Value: arn:aws:example:eu-west-2:123456789012:example-resource"
      - "Partition 'example' is not a valid AWS partition (valid: aws, aws-cn, aws-us-gov)"
      - "Account ID 123456789012 is the AWS documentation example"
    notes: "Scanner MUST NOT flag this as a real secret. It is a documented false-positive test case."

  - id: "fintech-main-hsts-present"
    host: "paleon-lab-fintech.co.uk"
    type: "security-header-present"
    title: "HSTS header present on main site"
    description: "Main site includes Strict-Transport-Security header with 1-year max-age and includeSubDomains."
    severity: "observed"
    status: "must_be_reported"
    evidence:
      - "Header: Strict-Transport-Security: max-age=31536000; includeSubDomains"
    notes: "This is a positive finding (header present). Included for completeness."

  - id: "fintech-main-csp-present"
    host: "paleon-lab-fintech.co.uk"
    type: "security-header-present"
    title: "Content-Security-Policy header present"
    description: "Main site includes a restrictive CSP header."
    severity: "observed"
    status: "must_be_reported"
    evidence:
      - "Header: Content-Security-Policy: default-src 'self'; img-src 'self' data:; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'"

  - id: "fintech-main-clean-urls"
    host: "paleon-lab-fintech.co.uk"
    type: "clean-url-routing"
    title: "Clean URL routing (no .html extensions)"
    description: "Routes like /about, /services, /solutions, /resources, /contact serve index.html from directories without .html in URL."
    severity: "observed"
    status: "must_be_reported"
    evidence:
      - "HTTP 200 for /about, /services, /solutions, /resources, /contact"
      - "No redirect to .html variants"

