      - "Target hostname resolves to NXDOMAIN"
    notes: "Second safe indicator using different pattern."

  # ---------------------------------------------------------------------------
  # NETWORK / INFRASTRUCTURE
  # ---------------------------------------------------------------------------
  - id: "fintech-port-5432-reachable"
    type: "open-port"
    title: "TCP port 5432 reachable from Internet"
    description: "Port 5432 (PostgreSQL default) accepts TCP connections from the Internet. A dummy listener (socat) accepts and immediately closes connections. No PostgreSQL service is running."
    severity: "observed"
    status: "must_be_reported"
    evidence:
      - "TCP SYN to port 5432 returns SYN-ACK"
      - "Connection accepted then closed (no PostgreSQL protocol)"
      - "No banner, no authentication prompt"
    notes: "Intentional test condition. Scanner should report 'port 5432 open/reachable' not 'PostgreSQL service detected'. No real database exists."

  - id: "fintech-port-22-restricted"
