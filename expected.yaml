  # APP HOST (app.paleon-lab-fintech.co.uk)
  # ---------------------------------------------------------------------------
  - id: "fintech-app-hsts-missing"
    host: "app.paleon-lab-fintech.co.uk"
    type: "missing-security-header"
    title: "HSTS header missing on app host"
    description: "The app.paleon-lab-fintech.co.uk host intentionally omits the Strict-Transport-Security header."
    severity: "observed"
    status: "must_be_reported"
    evidence:
      - "No Strict-Transport-Security header in HTTPS response"
      - "Other headers (X-Content-Type-Options, X-Frame-Options) are present"
    notes: "Intentional test condition. The main site and API host DO have HSTS."

  - id: "fintech-app-no-auth"
    host: "app.paleon-lab-fintech.co.uk"
    type: "no-authentication"
    title: "App host has no authentication"
    description: "The app console is accessible without any authentication mechanism."
    severity: "observed"
    status: "must_be_reported"
    evidence:
