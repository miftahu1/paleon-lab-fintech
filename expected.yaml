  - pattern: "confirmed-cve-nginx-1.14.0"
    description: "The outdated Server header (nginx/1.14.0) must NOT be reported as a confirmed CVE exploitation."
    reason: "This is a version disclosure indicator only. No exploit is present or implied. Classification should be 'detected/inferred outdated component'."
    related_detection_id: "fintech-dev-outdated-server-header"

  - pattern: "expired-tls-certificate"
    description: "The TLS certificate for paleon-lab-fintech.co.uk is NOT expired (unlike Site 4). Do not report as expired."
    reason: "This site uses a valid self-signed certificate. Only Site 4 (Northbridge) uses an expired certificate."
    related_detection_id: "fintech-tls-cert-valid"

  - pattern: "real-customer-data"
    description: "No real customer data, PII, or financial records exist anywhere in this test environment."
    reason: "All data is synthetic/fictional by design."
    related_detection_id: "fintech-api-fake-examples"

  - pattern: "legacy-tls-not-externally-observable"
    description: "TLS 1.0 / TLS 1.1 listed in site configuration is NOT externally negotiable on Ubuntu 26.04 with OpenSSL 3.5. Scanners must NOT report TLS1.0/TLS1.1 as observed for this site when running on stock Ubuntu 26.04/OpenSSL 3.5. Enabling negotiation would require altering the system OpenSSL policy or using a non-default OpenSSL provider, which weakens global system security."
    reason: "OpenSSL 3.5 disables legacy protocol negotiation by default; the site intentionally documents the configuration but it is not externally observable on the target platform."
    related_detection_id: "fintech-dev-tls-legacy"

