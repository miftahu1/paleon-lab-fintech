  # ---------------------------------------------------------------------------
  - id: "fintech-dev-outdated-server-header"
    host: "dev.paleon-lab-fintech.co.uk"
    type: "outdated-component-indicator"
    title: "Outdated Server header disclosed (nginx/1.14.0)"
    description: "The dev host explicitly sets 'Server: nginx/1.14.0' via more_set_headers. nginx 1.14.0 reached EOL on 2019-10-01."
    severity: "detected"
    status: "must_be_reported"
    classification: "outdated-component"
    evidence:
      - "HTTP response header: Server: nginx/1.14.0"
      - "nginx 1.14.0 EOL date: 2019-10-01"
    notes: "This is an INDICATOR of an outdated component. It does NOT imply confirmed exploitability. Expected classification: detected/inferred outdated component, NOT confirmed CVE exploitation."

  - id: "fintech-dev-tls-legacy"
    host: "dev.paleon-lab-fintech.co.uk"
    type: "legacy-tls-configuration"
    title: "Legacy TLS protocols enabled (TLS 1.0, 1.1)"
    description: "The dev host enables TLSv1 and TLSv1.1 in addition to 1.2/1.3."
    severity: "observed"
    status: "must_be_reported"
    evidence:
      - "ssl_protocols includes TLSv1 TLSv1.1 TLSv1.2 TLSv1.3"
      - "TLS 1.0/1.1 deprecated (RFC 8996)"
    notes: "Configuration-level indicator only."

  - id: "fintech-dev-hsts-missing"
    host: "dev.paleon-lab-fintech.co.uk"
    type: "missing-security-header"
    title: "HSTS header missing on dev host"
    description: "The dev host omits Strict-Transport-Security header."
    severity: "observed"
    status: "must_be_reported"
    evidence:
      - "No Strict-Transport-Security header in HTTPS response"
    notes: "Intentional for legacy host simulation."

