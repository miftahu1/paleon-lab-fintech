  - pattern: "real-aws-credentials"
    description: "The fake AWS ARN (arn:aws:example:...) and fake AWS keys (FAKEAWSACCESSKEYPLACEHOLDER, example-secret-access-key-placeholder) in /.env must NOT be flagged as real AWS secrets."
    reason: "Uses 'example' partition and documented example account ID 123456789012"
    related_detection_id: "fintech-main-env-exposure"

  - pattern: "real-stripe-keys"
    description: "The fake Stripe keys (pk_test_fakeplaceholder123, sk_test_fakeplaceholder123) in /.env must NOT be flagged as real Stripe keys."
    reason: "Prefix 'pk_test_' and 'sk_test_' with 'fakeplaceholder' suffix — recognizably fake"
    related_detection_id: "fintech-main-env-exposure"

  - pattern: "real-sentry-dsn"
    description: "The fake Sentry DSN (https://fake@sentry.example.com/123) must NOT be flagged."
    reason: "Uses 'fake' username and 'example.com' domain"
    related_detection_id: "fintech-main-env-exposure"

  - pattern: "postgresql-service"
    description: "Port 5432 reachability must NOT be reported as 'PostgreSQL service detected' or 'database exposed'."
    reason: "Only a dummy TCP listener (socat) accepts and closes connections. No PostgreSQL protocol, no banner, no data."
    related_detection_id: "fintech-port-5432-reachable"

  - pattern: "subdomain-takeover-exploitable"
    description: "The dangling CNAMEs for staging and dev-old must NOT be reported as exploitable/claimable takeover vulnerabilities."
