      - "Target hostname resolves to NXDOMAIN"
      - "Target contains source domain — not a claimable third-party namespace"
    notes: "SAFE INDICATOR — not an actually claimable takeover target. Documented in subdomain-takeover-indicator.txt. Expected classification: observed (indicator present, not exploitable)."

