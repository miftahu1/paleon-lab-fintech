    title: "OpenAPI spec contains only synthetic/fake examples"
    description: "All example values in the OpenAPI spec are recognizably fake (T-9041, M-1234, GB29NWBK..., whsec_...). No real customer data."
    severity: "observed"
    status: "must_be_reported"
    evidence:
      - "Payment example id: T-9041"
      - "Merchant example id: M-1234"
      - "IBAN example: GB29NWBK60161331926819 (valid format, fake)"
      - "Webhook secret example: whsec_fakeplaceholder123"
    notes: "Scanner should recognize these as test data patterns."

