# =============================================================================
# Paleon Fintech Test Site (Site 1) — Expected Scanner Findings
# Domain: paleon-lab-fintech.co.uk
#
# This file documents what the Paleon external scanner SHOULD and MUST NOT detect.
# It serves as the ground truth for test validation.
#
# Severity levels used:
#   observed    — Directly observable (header present, port open, file accessible)
#   detected    — Inferred from observable evidence with high confidence
#   inferred    — Reasonable deduction from observable evidence
#   likely      — Probable but not directly confirmed
#
# "observed/detected/inferred/likely" are preferred over "confirmed" for scanner
# findings because external scanners cannot confirm exploitability from outside.
# =============================================================================

site:
  name: "Paleon Fintech Test Site (Site 1)"
  domain: "paleon-lab-fintech.co.uk"
  hosts:
    - "paleon-lab-fintech.co.uk"
    - "www.paleon-lab-fintech.co.uk"
