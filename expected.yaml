      - "Connection from other IPs: filtered/timeout"

  - id: "fintech-ports-not-exposed"
    type: "port-not-exposed"
    title: "Common risky ports NOT exposed"
    description: "The following ports are confirmed NOT reachable from the Internet: 3306 (MySQL), 3389 (RDP), 445 (SMB), 23 (Telnet), 25 (SMTP), 6379 (Redis), 27017 (MongoDB)."
    severity: "observed"
    status: "must_be_reported"
    evidence:
      - "TCP SYN to each port: filtered/timeout"
    notes: "Positive finding — these ports are correctly closed."

