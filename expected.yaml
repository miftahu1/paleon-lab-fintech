  # ---------------------------------------------------------------------------
  - id: "fintech-api-swagger-exposed"
    host: "api.paleon-lab-fintech.co.uk"
    path: "/swagger.json"
    type: "openapi-spec-exposed"
    title: "OpenAPI 3.1 specification exposed at /swagger.json"
