# =============================================================================
# Nginx configuration — Paleon Fintech Test Site (Site 1)
# Domain: paleon-lab-fintech.co.uk
# Hosts: main, app, api, dev (4 virtual hosts)
#
# This config intentionally includes several scanner-test conditions:
#   - api host: exposes /swagger.json (fake OpenAPI 3.1)
#   - app host: OMITS HSTS header (intentional finding)
#   - dev host: reports outdated Server header (nginx/1.14.0) — indicator only
#   - .env file exposed at web root (intentional; contains only fake placeholders)
#
# Port 5432 is handled by a separate dummy TCP listener (see
# dummy-postgres.listener.service) and is NOT served by nginx.
#
# Requires: libnginx-mod-http-headers-more-filter (for more_set_headers)
#   Ubuntu: apt install libnginx-mod-http-headers-more-filter
# =============================================================================

# Load headers-more module for more_set_headers directive (required on Ubuntu 26.04+)
load_module modules/ngx_http_headers_more_filter_module.so;

# Default strong settings
server_tokens off;  # Hide version on main/app/api; dev overrides via more_set_headers

# -----------------------------------------------------------------------------
# MAIN SITE: paleon-lab-fintech.co.uk
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name paleon-lab-fintech.co.uk www.paleon-lab-fintech.co.uk;

    # Redirect HTTP → HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name paleon-lab-fintech.co.uk www.paleon-lab-fintech.co.uk;

    root /var/www/paleon-fintech/main;
    index index.html;

    # Self-signed certificate (NOT expired — this site does not require expiry finding)
    ssl_certificate     /etc/ssl/certs/paleon-fintech.crt;
    ssl_certificate_key /etc/ssl/private/paleon-fintech.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers (main site has full set)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Clean URLs: serve /foo as /foo/index.html
    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    # Intentionally exposed .env (FAKE placeholder values only)
    location = /.env {
        default_type text/plain;
        add_header Content-Type "text/plain; charset=utf-8" always;
    }

    # Static assets
    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Deny access to dotfiles except .well-known
    location ~ /\. {
        deny all;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}

# -----------------------------------------------------------------------------
# APP HOST: app.paleon-lab-fintech.co.uk
# INTENTIONAL: HSTS header is OMITTED on this host (scanner finding)
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name app.paleon-lab-fintech.co.uk;

    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.paleon-lab-fintech.co.uk;

    root /var/www/paleon-fintech/app;
    index index.html;

    ssl_certificate     /etc/ssl/certs/paleon-fintech.crt;
    ssl_certificate_key /etc/ssl/private/paleon-fintech.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # NOTE: HSTS intentionally NOT set on this host for testing.
    # Other headers present:
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}

# -----------------------------------------------------------------------------
# API HOST: api.paleon-lab-fintech.co.uk
# Serves fake OpenAPI 3.1 spec at /swagger.json (no real backend)
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.paleon-lab-fintech.co.uk;

    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.paleon-lab-fintech.co.uk;

    root /var/www/paleon-fintech/api;
    index index.html;

    ssl_certificate     /etc/ssl/certs/paleon-fintech.crt;
    ssl_certificate_key /etc/ssl/private/paleon-fintech.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    # Expose swagger.json (intentional; fake OpenAPI 3.1 spec)
    location = /swagger.json {
        default_type application/json;
        add_header Content-Type "application/json; charset=utf-8" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}

# -----------------------------------------------------------------------------
# DEV HOST: dev.paleon-lab-fintech.co.uk
# INTENTIONAL: reports outdated Server header (nginx/1.14.0) for scanner testing
# This is an INDICATOR of outdated component — NOT a confirmed CVE/exploit.
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name dev.paleon-lab-fintech.co.uk;

    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev.paleon-lab-fintech.co.uk;

    root /var/www/paleon-fintech/dev;
    index index.html;

    ssl_certificate     /etc/ssl/certs/paleon-fintech.crt;
    ssl_certificate_key /etc/ssl/private/paleon-fintech.key;

    # Allow older TLS versions on this legacy host (intentional indicator)
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # HSTS also omitted on dev host
    add_header X-Content-Type-Options "nosniff" always;

    # INTENTIONAL: disclose outdated server version as a detectable indicator
    # (requires libnginx-mod-http-headers-more-filter)
    more_set_headers 'Server: nginx/1.14.0';

    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}

# -----------------------------------------------------------------------------
# STAGING HOST: staging.paleon-lab-fintech.co.uk
# SAFE subdomain-takeover INDICATOR (CNAME to non-existent target)
# No server block needed — DNS CNAME points to a non-existent hostname.
# Scanners may flag dangling CNAME; see subdomain-takeover-indicator.txt
# -----------------------------------------------------------------------------
